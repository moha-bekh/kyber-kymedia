[package]
name = "avserver"
version = "0.1.0"
edition = "2021"

[dependencies]
ctrlc = "3.3.3"
log = "0.4.21"
log4rs = "1.3.0"
tokio = {version = "1.36.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

avservice = { path = "../avservice" }
avservice-types = { path = "../avservice-types" }
libkypc = "0.1.0"
txproto-rs = { path = "../txproto-rs" }

[features]
win32-hide-console = []
