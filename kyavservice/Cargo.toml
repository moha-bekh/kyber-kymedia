[package]
name = "kyavservice"
version = "0.1.0"
edition = { workspace = true }

[features]
default = ["watermark"]
watermark = ["dep:kywatermark", "txproto-rs/watermark"]

[lints]
workspace = true

[dependencies]
libc = "0.2"
log = { version = "0.4.21", features = ["serde"] }
log4ky = { version = "0.1.0", features = ["toml"] }
rmp-serde = "1.1.2"
serde = "1.0.197"
serde_ignored = "0.1"
serde_json = "1.0.114"
thiserror = "2.0"
tokio = { version = "1.36.0", features = ["fs", "time"] }
toml = "1.1"

libkypc = "0.1.0"
kyavservice-types = { path = "../kyavservice-types" }
kycom = "0.1.0"
txproto-rs = { path = "../txproto-rs", default-features = false }
libavconv-rs = { path = "../libavconv-rs" }
kywatermark = { path = "../kywatermark-rs", package = "kywatermark-rs", optional = true }

[dev-dependencies]
tokio = { version = "1.36.0", features = ["macros", "rt-multi-thread"] }
