[package]
name = "kyavservice"
version = "0.1.0"
edition = { workspace = true }

[dependencies]
log = "0.4.21"
rmp-serde = "1.1.2"
serde = "1.0.197"
serde_json = "1.0.114"
thiserror = "2.0"
tokio = { version = "1.36.0", features = ["fs", "time"] }
toml = "1.1"

libkypc = "0.1.0"
kyavservice-types = { path = "../kyavservice-types" }
kycom = "0.1.0"
txproto-rs = { path = "../txproto-rs" }

[dev-dependencies]
tokio = { version = "1.36.0", features = ["macros", "rt-multi-thread"] }
