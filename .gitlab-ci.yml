variables:
  GIT_SUBMODULE_STRATEGY: recursive
  ANDROID_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-android:20250819181536
  DEBIAN_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-trixie:20260106094705
  WASM_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-wasm:20260106095239
  WIN64_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-win64:20260106095522
  MACOS_RUST_VERSION: 1.89.0
  WEB_FEATURES: js

stages:
  - lint
  - build
  - test
  - misc

.variables-macos-x86_64: &variables-macos-x86_64
  CARGO_TARGET: x86_64-apple-darwin

.variables-macos-arm64: &variables-macos-arm64
  CARGO_TARGET: aarch64-apple-darwin

.variables-ios: &variables-ios
  RUST_TARGET: aarch64-apple-ios
  RUST_VERSION: 1.89.0

.variables-tvos: &variables-tvos
  RUST_TARGET: aarch64-apple-tvos
  RUST_VERSION: nightly-2025-08-24
  CARGOC_FLAGS: -Zbuild-std=std,panic_abort

.variables-visionos: &variables-visionos
  RUST_TARGET: aarch64-apple-visionos
  RUST_VERSION: nightly-2025-08-24
  CARGOC_FLAGS: -Zbuild-std=std,panic_abort

.variables-android-arm64: &variables-android-arm64
  HOST_ARCH: arm64

.variables-android-armv7a: &variables-android-armv7a
  HOST_ARCH: armv7a


lint:
  stage: lint
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script:
    - cargo fmt -- --check
  cache: []

build-debian-bookworm-x86_64:
  stage: build
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    cargo cinstall \
        --release \
        --prefix="$(pwd)/rootfs"

test-debian-bookworm-x86_64:
  stage: test
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - build-debian-bookworm-x86_64
  script: |
    cargo test \
        --release

clippy-debian-bookworm-x86_64:
  stage: misc
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - build-debian-bookworm-x86_64
  script: |
    cargo clippy \
        --features capi \
        -- -D warnings

build-windows-x86_64:
  stage: build
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    cargo cinstall \
        --release \
        --prefix="$(pwd)/rootfs" \
        --target=x86_64-pc-windows-gnu \
        --dlltool=x86_64-w64-mingw32-dlltool

clippy-windows-x86_64:
  stage: misc
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - build-windows-x86_64
  script: |
    cargo clippy \
        --target x86_64-pc-windows-gnu \
        --features capi \
        -- -D warnings

.macos-common:
  before_script: |
    rustup override set $MACOS_RUST_VERSION

.build-macos-common:
  extends: .macos-common
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    cargo cinstall --prefix="$(pwd)/rootfs" \
        --target=$CARGO_TARGET \
        --release

.clippy-macos-common:
  extends: .macos-common
  stage: misc
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    cargo clippy \
        --target=$CARGO_TARGET \
        --features capi \
        -- -D warnings

build-macos-x86_64:
  extends: .build-macos-common
  variables: *variables-macos-x86_64

clippy-macos-x86_64:
  extends: .clippy-macos-common
  variables: *variables-macos-x86_64
  needs:
    - build-macos-x86_64

build-macos-arm64:
  extends: .build-macos-common
  variables: *variables-macos-arm64

test-macos-arm64:
  extends: .macos-common
  variables: *variables-macos-arm64
  stage: test
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  needs:
    - build-macos-arm64
  script: |
    cargo test \
        --target=$CARGO_TARGET \
        --release \
        --features capi

clippy-macos-arm64:
  extends: .clippy-macos-common
  variables: *variables-macos-arm64
  needs:
    - build-macos-arm64

build-wasm:
  stage: build
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - lint
  script: |
    cargo build \
        --target wasm32-unknown-unknown \
        --features $WEB_FEATURES

clippy-wasm:
  stage: misc
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - build-wasm
  script: |
    cargo clippy \
        --target wasm32-unknown-unknown \
        --features $WEB_FEATURES \
        -- -D warnings

.build-ios-common:
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    rustup override set $RUST_VERSION
    cargo cinstall --prefix="$(pwd)/rootfs" \
      --target=$RUST_TARGET \
      $CARGOC_FLAGS \
      --release \
      --library-type=staticlib

  needs:
    - lint
  when: manual

build-ios:
  extends: .build-ios-common
  variables: *variables-ios

build-tvos:
  extends: .build-ios-common
  variables: *variables-tvos

build-visionos:
  extends: .build-ios-common
  variables: *variables-visionos

.build-android-common:
  stage: build
  image: $ANDROID_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    ANDROID_API=21

    case $HOST_ARCH in
        armv7a)
            CARGO_TARGET="armv7-linux-androideabi"
            ANDROID_ARCH="armv7a-linux-androideabi"
            VLC_CONTRIB="arm-linux-androideabi"

            export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="armv7a-linux-androideabi$ANDROID_API-clang"
        ;;
        arm64)
            CARGO_TARGET="aarch64-linux-android"
            ANDROID_ARCH="aarch64-linux-android"
            VLC_CONTRIB="aarch64-linux-android"

            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="aarch64-linux-android$ANDROID_API-clang"
        ;;
        *)
            echo "Unexpected arch $HOST_ARCH"
            exit 1
        ;;
    esac

    export TARGET_AR=llvm-ar
    export TARGET_CC=$ANDROID_ARCH$ANDROID_API-clang
    export RUSTFLAGS="-L native=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$ANDROID_ARCH/$ANDROID_API"

    cd "$KYAUDIOREG_SRCDIR"
    cargo cinstall \
        --prefix="$VLC_SRCDIR/contrib/$VLC_CONTRIB" \
        --library-type=staticlib \
        --release \
        --target=$CARGO_TARGET
    cd -

    unset CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
    unset CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
    unset TARGET_AR
    unset TARGET_CC
    unset RUSTFLAGS
  needs:
    - lint
  when: manual

build-android-arm64:
  extends: .build-android-common
  variables: *variables-android-arm64

build-android-armv7a:
  extends: .build-android-common
  variables: *variables-android-armv7a

