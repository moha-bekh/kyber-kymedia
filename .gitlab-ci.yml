variables:
  GIT_SUBMODULE_STRATEGY: recursive
  ANDROID_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-android:20250819181536
  DEBIAN_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-trixie:20260106094705
  WASM_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-wasm:20260106095239
  WIN64_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-win64:20260106095522
  MACOS_RUST_VERSION: 1.89.0
  WEB_FEATURES: js

stages:
  - lint
  - build
  - test
  - misc

.variables-macos-x86_64: &variables-macos-x86_64
  HOST_ARCH: x86_64

.variables-macos-arm64: &variables-macos-arm64
  HOST_ARCH: arm64

.variables-ios: &variables-ios
  RUST_TARGET: aarch64-apple-ios
  RUST_VERSION: 1.89.0

.variables-tvos: &variables-tvos
  RUST_TARGET: aarch64-apple-tvos
  RUST_VERSION: nightly-2025-08-24
  CARGOC_FLAGS: -Zbuild-std=std,panic_abort

.variables-visionos: &variables-visionos
  RUST_TARGET: aarch64-apple-visionos
  RUST_VERSION: nightly-2025-08-24
  CARGOC_FLAGS: -Zbuild-std=std,panic_abort

.variables-android-arm64: &variables-android-arm64
  HOST_ARCH: arm64

.variables-android-armv7a: &variables-android-armv7a
  HOST_ARCH: armv7a


lint:
  stage: lint
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script:
    - cargo fmt -- --check
  cache: []

build-debian-bookworm-x86_64:
  stage: build
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    ./build-linux.sh -o $(pwd)/rootfs

test-debian-bookworm-x86_64:
  stage: test
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - build-debian-bookworm-x86_64
  script: |
    ./build-linux.sh -t -o $(pwd)/rootfs

clippy-debian-bookworm-x86_64:
  stage: misc
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - build-debian-bookworm-x86_64
  script: |
    ./build-linux.sh -c -o $(pwd)/rootfs

build-windows-x86_64:
  stage: build
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    ./build-win32.sh -o $(pwd)/rootfs

clippy-windows-x86_64:
  stage: misc
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - build-windows-x86_64
  script: |
    ./build-win32.sh -c -o $(pwd)/rootfs

.macos-common:
  before_script: |
    rustup override set $MACOS_RUST_VERSION

.build-macos-common:
  extends: .macos-common
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    ./build-macos.sh -a $HOST_ARCH -o $(pwd)/rootfs

.clippy-macos-common:
  extends: .macos-common
  stage: misc
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    ./build-macos.sh -c -a $HOST_ARCH -o $(pwd)/rootfs

build-macos-x86_64:
  extends: .build-macos-common
  variables: *variables-macos-x86_64

clippy-macos-x86_64:
  extends: .clippy-macos-common
  variables: *variables-macos-x86_64
  needs:
    - build-macos-x86_64

build-macos-arm64:
  extends: .build-macos-common
  variables: *variables-macos-arm64

test-macos-arm64:
  extends: .macos-common
  variables: *variables-macos-arm64
  stage: test
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  needs:
    - build-macos-arm64
  script: |
    ./build-macos.sh -t -a $HOST_ARCH -o $(pwd)/rootfs

clippy-macos-arm64:
  extends: .clippy-macos-common
  variables: *variables-macos-arm64
  needs:
    - build-macos-arm64

build-wasm:
  stage: build
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - lint
  script: |
    ./build-wasm.sh -f $WEB_FEATURES

clippy-wasm:
  stage: misc
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - build-wasm
  script: |
    ./build-wasm.sh -c -f $WEB_FEATURES

.build-ios-common:
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    ./build-ios.sh -o $(pwd)/rootfs -t $IOS_TARGET -r $RUST_VERSION
  needs:
    - lint
  when: manual

build-ios:
  extends: .build-ios-common
  variables:
    <<: *variables-ios
    IOS_TARGET: ios

build-tvos:
  extends: .build-ios-common
  variables:
    <<: *variables-tvos
    IOS_TARGET: tvos

build-visionos:
  extends: .build-ios-common
  variables:
    <<: *variables-visionos
    IOS_TARGET: visionos

.build-android-common:
  stage: build
  image: $ANDROID_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    ./build-android.sh -o $(pwd)/rootfs -a $HOST_ARCH
  needs:
    - lint
  when: manual

build-android-arm64:
  extends: .build-android-common
  variables: *variables-android-arm64

build-android-armv7a:
  extends: .build-android-common
  variables: *variables-android-armv7a

